name: Publish dispensing database
on:
  workflow_dispatch:
  push:
    paths:
      - 'dispensing-manifest.json'
      - 'build_dispensing.py'
permissions:
  contents: read
concurrency:
  group: publish-database
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and verify snapshot
        run: |
          set -euo pipefail
          python3 -m venv /tmp/db-env
          /tmp/db-env/bin/pip install duckdb==1.4.4
          /tmp/db-env/bin/python build_dispensing.py dispensing.duckdb
          /tmp/db-env/bin/python verify_snapshot.py dispensing.duckdb
          split -b 1700M -d dispensing.duckdb dispensing.part-
          sha256sum dispensing.part-* dispensing.duckdb > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-snapshot
          retention-days: 1
          compression-level: 0
          path: |
            dispensing.part-*
            SHA256SUMS
            dispensing-manifest.json
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-snapshot
      - name: Verify transfer before publishing
        run: |
          set -euo pipefail
          cat dispensing.part-00 dispensing.part-01 > dispensing.duckdb
          sha256sum dispensing.part-00 dispensing.part-01 dispensing.duckdb > computed
          diff -u SHA256SUMS computed
      - name: Publish verified release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="dispensing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "NHS dispensing database" --notes 'Download both dispensing.part files, concatenate them in numeric order into dispensing.duckdb, and check SHA256SUMS. Open the database locally with DuckDB. Contains NHSBSA data licensed under the Open Government Licence v3.0.'
          gh release upload "$tag" dispensing.part-* SHA256SUMS dispensing-manifest.json
          gh release edit "$tag" --draft=false --latest
