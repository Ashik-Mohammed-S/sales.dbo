name: Publish dispensing database
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-database.yml'
      - 'dispensing-manifest.json'
      - 'build_dispensing.py'
permissions:
  contents: read
concurrency:
  group: publish-database
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and verify snapshot
        run: |
          set -euo pipefail
          python3 -m venv /tmp/db-env
          /tmp/db-env/bin/pip install duckdb==1.4.4
          /tmp/db-env/bin/python build_dispensing.py dispensing.duckdb
          /tmp/db-env/bin/python - <<'PY'
          import json
          import duckdb
          from pathlib import Path
          manifest = json.loads(Path("dispensing-manifest.json").read_text())
          with duckdb.connect("dispensing.duckdb", read_only=True) as db:
              actual = db.execute("""SELECT year_month, count(*), csv_sha256
                  FROM dispensing JOIN releases USING (year_month)
                  GROUP BY ALL ORDER BY year_month""").fetchall()
              expected = [(r["year_month"], r["rows"], r["csv_sha256"]) for r in manifest["releases"]]
              if actual != expected or db.execute("SELECT count(*) FROM dispensing").fetchone()[0] != manifest["rows"]:
                  raise ValueError("Database differs from verified manifest")
          PY
          split -b 1700M -d dispensing.duckdb dispensing.part-
          sha256sum dispensing.part-* dispensing.duckdb > SHA256SUMS
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="dispensing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "NHS dispensing database" --notes 'Download both dispensing.part files, concatenate them in numeric order into dispensing.duckdb, and check SHA256SUMS. Open the database locally with DuckDB. Contains NHSBSA data licensed under the Open Government Licence v3.0.'
          gh release upload "$tag" dispensing.part-* SHA256SUMS dispensing-manifest.json
          gh release edit "$tag" --draft=false --latest
