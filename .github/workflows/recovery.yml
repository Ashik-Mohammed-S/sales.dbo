name: Public release recovery
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: Optional version tag to rehearse rollback
        required: false
  push:
    paths:
      - '.github/workflows/recovery.yml'
      - 'ops/recover.sh'
      - 'verify_snapshot.py'
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install duckdb==1.4.4
      - name: Recover from public downloads without credentials
        env:
          TAG: ${{ inputs.tag }}
        run: bash ops/recover.sh "$TAG"
  alert:
    if: failure() && needs.recover.result == 'failure'
    needs: recover
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the recovery incident
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title='Public database recovery failed'
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json title,number --jq '.[] | select(.title=="Public database recovery failed") | .number' | head -1)
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "Recovery failed again. $url"
          else
            gh issue create --title "$title" --body "The public snapshot did not pass the reader recovery drill. Inspect $url and follow OPERATIONS.md." --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
